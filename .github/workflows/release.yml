name: 'C++ CI Lab2'

on:
  push:
    branches:
      - lab2
      - feature/github_actions

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    permissions: write-all
    steps:
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number}}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false

  release_assets_ubuntu:
    name: Build and Test Ubuntu
    needs: create_release
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
      
      - name: Configure CMake
        run: cmake . -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: cmake --build .
      
      - name: Run tests
        run: cmake --build . --target test
      
      - name: Test with ip_filter.tsv
        run: cat ip_filter.tsv | ./src/ip_filter > output_ubuntu.txt
      
      - name: Create package
        run: cmake --build . --target package
      
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url}}
          asset_name: ip_filter-0.0.${{ github.run_number }}-Linux.zip
          asset_path: ./ip_filter-0.0.${{ github.run_number }}-Linux.zip
          asset_content_type: application/zip

  release_assets_windows:
    name: Build and Test Windows
    needs: create_release
    runs-on: windows-latest
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure CMake
        run: cmake -B build -DPATCH_VERSION=${{ github.run_number }}
      
      - name: Build
        run: cmake --build build --config Release
      
      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      
      - name: Test with ip_filter.tsv
        run: Get-Content ip_filter.tsv | .\build\src\Release\ip_filter.exe > output_windows.txt
      
      - name: Create package
        run: cmake --build build --target package --config Release
      
      - name: Upload Windows asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url}}
          asset_name: ip_filter-0.0.${{ github.run_number }}-Windows.zip
          asset_path: ./build/ip_filter-0.0.${{ github.run_number }}-win64.zip
          asset_content_type: application/zip